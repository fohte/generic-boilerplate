# Test fixture for a Rust root with a single Node subpackage (e.g. a docs site).
type: rust
project_name: rust-with-node-subpackage
description: Test Rust root with a node docs subpackage
is_public: false
use_release_please: false
use_coverage: false
monorepo_node_workspace: false
subpackages:
  - name: docs
    type: node
    # The docs subpackage will bring its own setup (Astro/Starlight etc.),
    # including its own Dockerfile if it needs one. `web_app: true` here
    # exercises the tests:false + web_app:true combination: it must NOT
    # produce a Dockerfile or a docker-publish.yml matrix entry, since
    # `tests: false` already collapses all of this subpackage's scaffolding.
    tests: false
    web_app: true
repo_language: ja
repo_id: ''
