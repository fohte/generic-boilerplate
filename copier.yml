_min_copier_version: '9.5.0'
_subdirectory: template
_answers_file: .copier-answers.yml

# Remove obsolete workflows when a generated repo is updated past the listed version.
_migrations:
  - version: '0.8.10'
    before:
      - rm -f .github/workflows/renovate-copier.yml

type:
  type: str
  choices:
    - base
    - node
    - rust
  default: base
  help: Project type (base = minimal template, node = Node.js/TypeScript project, rust = Rust project)

# Note: _folder_name cannot be used because it resolves to a temporary directory
# path during copier update. See: https://github.com/copier-org/copier/issues/1285
project_name:
  type: str
  help: Project name
  default: '{{ _folder_name }}'

description:
  type: str
  help: Project description for README.md
  default: ''

# README.md is expected to be customized immediately after repository creation,
# so conflicts are almost guaranteed on copier update. Skip to avoid this.
_skip_if_exists:
  - README.md
  # components.json's `style`/`aliases` are chosen per repo via `shadcn init`,
  # so copier update must not overwrite a repo's existing choice.
  - '*/components.json'

# Exclude files that are specific to this template repository
# and not needed in derived repositories
_exclude:
  # Exclude external refs plugin for private repos
  - '{% if not is_public %}commitlint-plugin-no-external-refs.cjs{% endif %}'
  # Conditional exclusion when release-please is disabled.
  # NOTE: Copier's _exclude matches against OUTPUT file names (without .jinja
  # suffix), not source file names.
  #
  #   _exclude pattern                 | use_release_please=true | =false
  #   ---------------------------------|-------------------------|----------
  #   release-please-config.json       | generated               | excluded
  #   release-please-config.json.jinja | generated               | generated
  - '{% if not use_release_please %}release-please-config.json{% endif %}'
  - '{% if not use_release_please %}.release-please-manifest.json{% endif %}'
  - '{% if not use_release_please %}.github/workflows/release-please.yml{% endif %}'
  - '{% if not use_release_please %}.github/workflows/test-release-please.yml{% endif %}'
  - '{% if not use_release_please %}.github/workflows/pr-title-check.yml{% endif %}'
  # Exclude Node.js specific files when type is not 'node'
  # Use leading / to match root only (not yield subpackage directories)
  # Non-workspace monorepos (even with node subpackages) keep prettier/commitlint
  # hosted by mise instead of a root package.json, so no root package.json is emitted.
  - "{% if type != 'node' and not is_workspace %}/package.json{% endif %}"
  - "{% if type != 'node' %}/tsconfig.json{% endif %}"
  - "{% if type != 'node' and not is_workspace %}/eslint.config.js{% endif %}"
  - "{% if type != 'node' %}/vitest.config.ts{% endif %}"
  # pnpm-workspace.yaml holds workspace packages and pnpm settings (allowBuilds).
  # Required for any project with a node root package; non-workspace node subpackages
  # get their own pnpm-workspace.yaml under the subpackage directory instead.
  - "{% if not is_workspace and type != 'node' %}/pnpm-workspace.yaml{% endif %}"
  # Exclude CLAUDE.md when there is no test code (no Rust and no Node)
  - '{% if not has_rust and not has_node %}/CLAUDE.md{% endif %}'
  # Exclude bootstrap workflow when no lockfile-producing language is involved
  - '{% if not has_node and not has_rust %}.github/workflows/bootstrap.yml{% endif %}'
  # Skip bootstrap workflow on `copier update`: existing repos already have
  # lockfiles, so the workflow would self-delete on the next push and leave a
  # stray commit.
  - '{% if _copier_operation == "update" %}.github/workflows/bootstrap.yml{% endif %}'
  # Exclude Rust specific files when type is not 'rust'
  - "{% if type != 'rust' %}/Cargo.toml{% endif %}"
  - "{% if type != 'rust' %}/rust-toolchain.toml{% endif %}"
  - "{% if type != 'rust' %}/clippy.toml{% endif %}"
  - '{% if not has_rust %}/sgconfig.yml{% endif %}'
  - '{% if not has_rust %}/.sg{% endif %}'
  - "{% if type != 'rust' %}/src/main.rs{% endif %}"
  # Exclude Node.js specific src files when type is not 'node'
  - "{% if type != 'node' %}/src/index.ts{% endif %}"
  - "{% if type != 'node' %}/src/index.test.ts{% endif %}"
  - "{% if type != 'node' %}/src/errors.ts{% endif %}"
  - "{% if type != 'node' %}/src/errors.test.ts{% endif %}"
  # Exclude observability bootstrap when the root project has neither web app
  # nor error tracking enabled. Monorepo subpackages declare their own status
  # via `web_app: true` / `error_tracking: true` on the subpackages entry;
  # the per-pkg bootstrap path is gated separately in the subpackage filename
  # template.
  - "{% if type != 'node' or not (is_web_app | default(false) or error_tracking | default(false)) %}/src/bootstrap.ts{% endif %}"
  # Exclude root-level web app build/container scaffolding when the root
  # project is not a node web app. Monorepo web_app_pkgs subpackages get their
  # own Dockerfile/tsup.config.ts (and, in non-workspace mode, .dockerignore)
  # via the subpackage filename template instead.
  - "{% if type != 'node' or not is_web_app | default(false) %}/Dockerfile{% endif %}"
  - "{% if type != 'node' or not is_web_app | default(false) %}/tsup.config.ts{% endif %}"
  # Root .dockerignore also covers workspace-mode web app subpackages, since
  # their Docker build context is the repo root.
  - "{% if not (type == 'node' and is_web_app | default(false)) and not (is_workspace and has_web_app_pkg) %}/.dockerignore{% endif %}"
  # docker-publish.yml is needed whenever there's anything to publish: the
  # root itself, or any monorepo web app subpackage (workspace or not).
  - '{% if not has_web_app %}.github/workflows/docker-publish.yml{% endif %}'
  # Exclude coverage files when coverage is disabled
  - '{% if not use_coverage %}/codecov.yml{% endif %}'
  # spa is a subpackage-only flag (see subpackages help below); there is no
  # standalone root SPA.
  - '{% if not has_spa_pkg %}.github/workflows/storybook.yml{% endif %}'
  # vrt is a subpackage-only flag (see subpackages help below); there is no
  # standalone root VRT.
  - '{% if not has_vrt_pkg %}.github/workflows/vrt.yml{% endif %}'
  - '{% if not has_vrt_pkg %}.github/workflows/vrt-approval.yml{% endif %}'
  # Root .storybook/ is only an {% include %} source for the per-subpackage
  # .storybook files (see the yield template); it is never rendered directly.
  - /.storybook
  # Same as /.storybook above: these are only {% include %} sources for the
  # per-subpackage spa/vrt scaffolding (see the yield template). spa/vrt are
  # subpackage-only flags, so they are never rendered directly.
  - /src/App.tsx
  - /src/main.tsx
  - /src/index.css
  - /src/lib/utils.ts
  - /src/vite-env.d.ts
  - /vite.config.ts
  - /components.json
  - /public
  - /vitest.screenshot.config.ts
  # Exclude type-specific files
  - "{% if type not in ['node', 'rust'] and not is_workspace and not has_node_pkg and not has_rust_pkg %}/.gitignore{% endif %}"
  - "{% if type not in ['node', 'rust'] %}/src{% endif %}"

# Template parameters
is_public:
  type: bool
  default: false
  help: Is this a public repository?

repo_language:
  type: str
  choices:
    - en
    - ja
  default: '{% if is_public %}en{% else %}ja{% endif %}'
  help: Primary language for repository documentation

# release-please settings
use_release_please:
  type: bool
  default: false
  help: Enable automated release management with release-please?

release_type:
  type: str
  choices:
    - simple
    - node
    - python
    - go
    - rust
    - java
  help: Select the release-type for your project
  when: '{{ use_release_please }}'

auto_merge_release_pr:
  type: bool
  default: false
  help: Automatically merge release-please PRs?
  when: '{{ use_release_please }}'

release_binary:
  type: bool
  default: false
  help: Build and upload release binaries?
  when: "{{ type == 'rust' and use_release_please }}"

binary_name:
  type: str
  help: Name of the binary to build
  when: '{{ release_binary }}'

# Monorepo subpackage definitions.
# When non-empty, infrastructure files (test.yml, lefthook, renovate, etc.)
# are generated in monorepo mode.
# Input via --data-file is recommended for this parameter.
subpackages:
  type: yaml
  multiline: true
  default: []
  help: |
    Subpackage definitions for monorepo.
    Example: [{name: frontend, type: node}, {name: backend, type: rust}]
    Per-entry flags (optional):
      spa: true        -- mark a node subpackage as a SPA (Vite + React +
                          Tailwind CSS + shadcn/ui + Storybook), and (unless
                          tests: false) add the pnpm allowBuilds entries for
                          workerd and msw for that subpackage.
      web_app: true    -- mark a node subpackage as a web app (long-running
                          HTTP server). Implies error_tracking (see below)
                          and additionally gates build/container scaffolding
                          (Dockerfile, tsup.config.ts, docker-publish.yml
                          matrix entry) and the pnpm allowBuilds entry for
                          protobufjs for that subpackage.
      web_app_port: 8080 -- port declared in the subpackage's Dockerfile EXPOSE
                          directive. Only meaningful with web_app: true;
                          defaults to 8080.
      error_tracking: true -- enable Sentry error tracking wiring
                          (dependencies + bootstrap import) for a node
                          subpackage independent of web_app.
      vrt: true        -- enable Visual Regression Testing for a spa
                          subpackage (requires spa: true; ignored otherwise).
                          Adds a screenshot-capture vitest project, the
                          storycap/reg-suit devDependencies, and vrt.yml /
                          vrt-approval.yml wired to
                          fohte/storybook-vrt-workflows@v0.1.2. Still needs
                          manual setup in the consuming repo: an
                          `<project_name>-vrt` R2 bucket with
                          AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo
                          secrets, and a `vrt-approved` label.
      tests: false     -- skip test scaffolding (vitest, tsconfig, src/, eslint),
                          the unit-test CI job, the per-package eslint
                          lefthook hook, and the pnpm install/cache step in
                          the lefthook CI job. Use for node subpackages that
                          bring their own setup, such as docs sites (Astro,
                          Starlight) or framework apps (Next.js).
  # `when: true` is the default but explicit here: hidden questions (when: false)
  # discard the stored answer, which would erase subpackages on every update.
  when: true

monorepo_node_workspace:
  type: bool
  help: Enable pnpm workspace for monorepo (hoists shared devDependencies to root)
  when: "{{ type == 'base' and (subpackages | selectattr('type', 'equalto', 'node') | list | length) > 0 }}"
  # `default` is evaluated even when `when` is false, so the `type == 'base'`
  # guard must also live here — otherwise a non-base root with >= 2 node
  # subpackages silently picks up `is_workspace=true`.
  default: "{{ type == 'base' and (subpackages | selectattr('type', 'equalto', 'node') | list | length) >= 2 }}"

use_coverage:
  type: bool
  default: false
  help: Enable code coverage with cargo-llvm-cov and Codecov?
  when: "{{ type == 'rust' or (subpackages | selectattr('type', 'equalto', 'rust') | list | length > 0) }}"

# Web app flag. Implies error_tracking (see below) and additionally drives
# build/container scaffolding (Dockerfile, tsup.config.ts, docker-publish.yml)
# and is intended to gate any future long-running-service scaffolding. For
# monorepos, set `web_app: true` on the relevant subpackages entry instead.
is_web_app:
  type: bool
  default: false
  help: Is this project a web app (a long-running process exposing an HTTP server)?
  when: "{{ type == 'node' }}"

web_app_port:
  type: int
  default: 8080
  help: Port declared in the generated Dockerfile's EXPOSE directive
  when: '{{ is_web_app | default(false) }}'

# Error tracking flag, independent of web app status. Installs the Sentry +
# OpenTelemetry dependency set and wires up the observability bootstrap
# (src/bootstrap.ts, imported first from src/index.ts) without the
# HTTP-server-specific build/start/dev scripts or container scaffolding that
# `is_web_app` adds. Implied by `is_web_app: true`. For monorepos, set
# `error_tracking: true` on the relevant subpackages entry instead.
error_tracking:
  type: bool
  default: false
  help: Enable Sentry error tracking independent of web app status?
  when: "{{ type == 'node' }}"

# Computed variables (not asked, derived from other answers).
# Centralized here so individual templates can reference them directly
# instead of redefining the same {%- set ... -%} expressions.
node_pkgs:
  type: yaml
  default: "{{ subpackages | default([]) | selectattr('type', 'equalto', 'node') | list }}"
  when: false

rust_pkgs:
  type: yaml
  default: "{{ subpackages | default([]) | selectattr('type', 'equalto', 'rust') | list }}"
  when: false

spa_pkgs:
  type: yaml
  # Mirrors web_app_pkgs: `tests: false` collapses the src/ segment and
  # skips the Vite/Storybook file emission for that subpackage, so a
  # `tests: false` pkg must not appear here even if `spa: true`.
  default: "{{ subpackages | default([]) | selectattr('spa', 'defined') | selectattr('spa', 'equalto', true) | rejectattr('tests', 'equalto', false) | list }}"
  when: false

web_app_pkgs:
  type: yaml
  # `tests: false` collapses the src/ segment and skips the
  # bootstrap.ts/Dockerfile emission for that subpackage (see the subpackage
  # filename templates), so a `tests: false` pkg must not appear here even if
  # `web_app: true` — otherwise docker-publish.yml's matrix would reference a
  # Dockerfile that was never generated.
  default: "{{ subpackages | default([]) | selectattr('web_app', 'defined') | selectattr('web_app', 'equalto', true) | rejectattr('tests', 'equalto', false) | list }}"
  when: false

error_tracking_pkgs:
  type: yaml
  # Mirrors web_app_pkgs: `tests: false` collapses the src/ segment and
  # skips the bootstrap.ts emission for that subpackage, so a `tests: false`
  # pkg must not appear here even if `error_tracking: true`.
  default: "{{ subpackages | default([]) | selectattr('error_tracking', 'defined') | selectattr('error_tracking', 'equalto', true) | rejectattr('tests', 'equalto', false) | list }}"
  when: false

vrt_pkgs:
  type: yaml
  # VRT captures Storybook, so it's meaningless without spa: true; a pkg
  # with vrt: true but spa unset/false is silently dropped here rather than
  # emitting a screenshot config with no Storybook to capture. Also mirrors
  # web_app_pkgs's `tests: false` handling.
  default: "{{ subpackages | default([]) | selectattr('vrt', 'defined') | selectattr('vrt', 'equalto', true) | selectattr('spa', 'defined') | selectattr('spa', 'equalto', true) | rejectattr('tests', 'equalto', false) | list }}"
  when: false

has_node_pkg:
  type: bool
  default: '{{ node_pkgs | length > 0 }}'
  when: false

has_rust_pkg:
  type: bool
  default: '{{ rust_pkgs | length > 0 }}'
  when: false

has_spa_pkg:
  type: bool
  default: '{{ spa_pkgs | length > 0 }}'
  when: false

has_vrt_pkg:
  type: bool
  default: '{{ vrt_pkgs | length > 0 }}'
  when: false

has_web_app_pkg:
  type: bool
  default: '{{ web_app_pkgs | length > 0 }}'
  when: false

has_error_tracking_pkg:
  type: bool
  default: '{{ error_tracking_pkgs | length > 0 }}'
  when: false

has_node:
  type: bool
  default: "{{ type == 'node' or has_node_pkg }}"
  when: false

has_web_app:
  type: bool
  default: '{{ is_web_app | default(false) or has_web_app_pkg }}'
  when: false

# Superset of has_web_app: true whenever the Sentry + OpenTelemetry
# dependency set is installed anywhere in the project (root or any
# subpackage), whether via web_app or error_tracking. Used to gate
# infrastructure shared by both, such as the pnpm protobufjs allowBuilds
# entry.
has_error_tracking:
  type: bool
  default: '{{ is_web_app | default(false) or error_tracking | default(false) or has_web_app_pkg or has_error_tracking_pkg }}'
  when: false

has_rust:
  type: bool
  default: "{{ type == 'rust' or has_rust_pkg }}"
  when: false

is_workspace:
  type: bool
  default: '{{ monorepo_node_workspace | default(false) }}'
  when: false
